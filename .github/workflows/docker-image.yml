name: Docker Image CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: checkout
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t mahakdashore/helloaction:latest .

      - name: push Docker image
        run: docker push mahakdashore/helloaction:latest
